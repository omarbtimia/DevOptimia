version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          echo "=== [1/3] DIAGNÓSTICO DE ENTORNO Y NODE.JS ==="
          if ! nvm install 22 || ! nvm use 22; then
            echo "[ERROR CRÍTICO] No se pudo instalar o activar Node 22."
            echo "  -> CAUSA PROBABLE: La imagen de compilación de Amplify es antigua (Amazon Linux 2 no soporta glibc para Node 22)."
            echo "  -> SOLUCIÓN: Ve a AWS Amplify -> Build settings -> Build image settings y cambia a 'Amazon Linux:2023'."
            exit 1
          fi
          echo "[OK] Node $(node -v) y NPM $(npm -v) activos."
        - |
          echo "=== [2/3] INSTALACIÓN DE DEPENDENCIAS ==="
          if ! npm ci --cache .npm --prefer-offline; then
            echo "[ERROR CRÍTICO] Falló 'npm ci'."
            echo "  -> CAUSA PROBABLE 1: 'package-lock.json' no está sincronizado con 'package.json'."
            echo "  -> CAUSA PROBABLE 2: Falta 'package-lock.json' en el repositorio o hay conflictos de peerDependencies."
            echo "  -> SOLUCIÓN: Ejecuta 'npm install' en local, sube el 'package-lock.json' actualizado y reintenta."
            exit 1
          fi
          echo "[OK] Dependencias instaladas correctamente."

    build:
      commands:
        - |
          echo "=== [1/4] GENERACIÓN Y AUDITORÍA DE VARIABLES DE ENTORNO ==="
          REQUIRED_VARS="AURORA_DSQL_HOST AURORA_DSQL_REGION AURORA_DSQL_DATABASE AURORA_DSQL_CRUD_USER AURORA_DSQL_READ_USER GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI"
          MISSING=0
          for VAR in $REQUIRED_VARS; do
            eval VAL=\${$VAR:-}
            if [ -z "$VAL" ]; then
              echo "[ALERTA] Variable requerida vacía o no configurada: $VAR"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "[ERROR CRÍTICO] Faltan variables obligatorias en Amplify."
            echo "  -> CAUSA: No están definidas en la consola o están restringidas a otra rama."
            echo "  -> SOLUCIÓN: Ve a Amplify -> Hosting -> Environment variables y verifica que apliquen a la rama '${AWS_BRANCH:-actual}'."
            exit 1
          fi

          printf '%s\n' \
            "AURORA_DSQL_HOST=${AURORA_DSQL_HOST:-}" \
            "AURORA_DSQL_REGION=${AURORA_DSQL_REGION:-}" \
            "AURORA_DSQL_DATABASE=${AURORA_DSQL_DATABASE:-}" \
            "AURORA_DSQL_PORT=${AURORA_DSQL_PORT:-5432}" \
            "AURORA_DSQL_CRUD_USER=${AURORA_DSQL_CRUD_USER:-}" \
            "AURORA_DSQL_READ_USER=${AURORA_DSQL_READ_USER:-}" \
            "AURORA_DSQL_POOL_MAX=${AURORA_DSQL_POOL_MAX:-}" \
            "AURORA_DSQL_TOKEN_EXPIRES_IN=${AURORA_DSQL_TOKEN_EXPIRES_IN:-}" \
            "AURORA_DSQL_TOKEN_TTL=${AURORA_DSQL_TOKEN_TTL:-}" \
            "AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}" \
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}" \
            "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}" \
            "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}" > .env.production

          if ! npm run env:check; then
            echo "[ERROR CRÍTICO] El validador 'npm run env:check' rechazó el archivo .env.production."
            echo "  -> CAUSA PROBABLE: Formato inválido (ej. URL sin https://, puerto no numérico o región mal escrita)."
            exit 1
          fi
          echo "[OK] Variables verificadas y escritas en .env.production."

        - |
          echo "=== [2/4] VERIFICACIÓN DE IDENTIDAD IAM Y RED ==="
          CALLER_ARN=""
          if command -v aws >/dev/null 2>&1; then
            echo "[INFO] Verificando rol IAM asignado al contenedor de Amplify..."
            if CALLER_JSON=$(aws sts get-caller-identity 2>/dev/null); then
              echo "$CALLER_JSON"
              CALLER_ARN=$(node -e "const d = $CALLER_JSON; console.log(d.Arn || '');")
              export AMPLIFY_CALLER_ARN="$CALLER_ARN"
            else
              echo "[AVISO] No hay rol IAM adjunto al Build de Amplify."
              echo "  -> SOLUCIÓN: Asigna un Service Role en Amplify -> App settings -> IAM roles."
            fi
          fi

          echo "[INFO] Probando resolución DNS del endpoint DSQL (${AURORA_DSQL_HOST})..."
          if command -v getent >/dev/null 2>&1 && ! getent hosts "${AURORA_DSQL_HOST}" >/dev/null 2>&1; then
            echo "[ERROR CRÍTICO] No se puede resolver el dominio del clúster: '${AURORA_DSQL_HOST}'."
            echo "  -> CAUSA PROBABLE 1: El clúster Aurora DSQL fue eliminado o el identificador tiene un error tipográfico."
            echo "  -> CAUSA PROBABLE 2: Incluiste 'https://' o el puerto dentro de AURORA_DSQL_HOST."
            exit 1
          fi
          echo "[OK] Endpoint DNS de Aurora DSQL válido."

        - |
          echo "=== [3/4] EVALUACIÓN Y EJECUCIÓN DE MIGRACIONES DSQL ==="
          set -e
          echo "[CONTEXTO] AWS_BRANCH='${AWS_BRANCH:-no_definida}' | AWS_PULL_REQUEST_ID='${AWS_PULL_REQUEST_ID:-ninguno}'"

          if [ "${AWS_BRANCH:-}" != "develop" ]; then
            echo "[OMITIDO] Migraciones canceladas: la rama actual es '${AWS_BRANCH:-desconocida}' y solo se permiten en 'develop'."
          elif [ -n "${AWS_PULL_REQUEST_ID:-}" ]; then
            echo "[OMITIDO] Migraciones canceladas: ejecución detectada en entorno Preview/PR (#${AWS_PULL_REQUEST_ID})."
          else
            echo "[EJECUTANDO] Rama 'develop' confirmada fuera de PR. Iniciando operaciones en Aurora DSQL..."

            npm run db:migrate:status || {
              echo "[ERROR EN DB:MIGRATE:STATUS] No se pudo consultar el estado de migraciones en '${AURORA_DSQL_HOST}'."
              echo "  -> CAUSA PROBABLE 1 (Permisos IAM): Al Service Role de Amplify le falta 'dsql:DbConnectAdmin' sobre el ARN del clúster."
              echo "  -> CAUSA PROBABLE 2 (Región): AURORA_DSQL_REGION ('${AURORA_DSQL_REGION}') no coincide con la región real del clúster."
              exit 1
            }

            AURORA_ALLOW_DESTRUCTIVE=0 npm run db:migrate || {
              echo "[ERROR EN DB:MIGRATE] Falló la aplicación de migraciones."
              echo "  -> CAUSA PROBABLE 1 (Bloqueo de seguridad): La migración intenta borrar tablas/columnas y AURORA_ALLOW_DESTRUCTIVE=0 lo bloqueó."
              echo "  -> CAUSA PROBABLE 2 (Límites de Aurora DSQL): El SQL incluye sintaxis no soportada en DSQL (ej. FOREIGN KEY, triggers o DDL + DML en la misma transacción)."
              echo "  -> CAUSA PROBABLE 3 (Concurrencia OCC): Conflicto de serialización en DSQL."
              exit 1
            }

            echo "[INFO] Asegurando existencia de roles (${AURORA_DSQL_CRUD_USER}, ${AURORA_DSQL_READ_USER}) en Aurora DSQL..."
            node --input-type=module << 'EOF' || {
              echo "[ERROR EN AUTO-PROVISIÓN DE ROLES] No se pudieron crear o mapear los roles en Aurora DSQL."
              echo "  -> CAUSA PROBABLE 1: El Service Role no tiene 'dsql:DbConnectAdmin' (solo el usuario 'admin' puede ejecutar CREATE ROLE)."
              echo "  -> CAUSA PROBABLE 2: Tu proyecto no usa 'pg' o '@aws-sdk/dsql-signer' directamente (en ese caso usa el script propio de tu ORM)."
              exit 1
            }
            import pg from 'pg';
            import { DsqlSigner } from '@aws-sdk/dsql-signer';

            const host = process.env.AURORA_DSQL_HOST;
            const region = process.env.AURORA_DSQL_REGION;
            const database = process.env.AURORA_DSQL_DATABASE || 'postgres';
            const port = Number(process.env.AURORA_DSQL_PORT || 5432);
            const roles = [process.env.AURORA_DSQL_CRUD_USER, process.env.AURORA_DSQL_READ_USER].filter(Boolean);

            // Convierte arn:aws:sts::123456789012:assumed-role/MiRol/Sesion -> arn:aws:iam::123456789012:role/MiRol
            let iamRoleArn = process.env.AURORA_DSQL_IAM_ROLE_ARN || '';
            if (!iamRoleArn && process.env.AMPLIFY_CALLER_ARN) {
              const match = process.env.AMPLIFY_CALLER_ARN.match(/^arn:aws:sts::(\d+):assumed-role\/([^/]+)\//);
              if (match) {
                iamRoleArn = `arn:aws:iam::${match[1]}:role/${match[2]}`;
              }
            }

            const signer = new DsqlSigner({ hostname: host, region });
            const password = await signer.getDbConnectAdminAuthToken();

            const client = new pg.Client({
              host,
              port,
              user: 'admin',
              password,
              database,
              ssl: { rejectUnauthorized: true },
            });

            await client.connect();
            try {
              for (const roleName of roles) {
                if (!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(roleName)) {
                  throw new Error(`Nombre de rol inválido: ${roleName}`);
                }
                const exists = await client.query('SELECT 1 FROM pg_roles WHERE rolname = $1', [roleName]);
                if (exists.rowCount === 0) {
                  await client.query(`CREATE ROLE "${roleName}" WITH LOGIN`);
                  console.log(`[OK] Rol '${roleName}' creado en Aurora DSQL.`);
                } else {
                  console.log(`[OK] Rol '${roleName}' ya existe.`);
                }

                if (iamRoleArn) {
                  const mapped = await client.query(
                    'SELECT 1 FROM sys.iam_pg_role_mappings WHERE pg_role_name = $1 AND arn = $2',
                    [roleName, iamRoleArn]
                  );
                  if (mapped.rowCount === 0) {
                    try {
                      await client.query(`AWS IAM GRANT "${roleName}" TO '${iamRoleArn}'`);
                      console.log(`[OK] Mapeo IAM creado: ${roleName} -> ${iamRoleArn}`);
                    } catch (err) {
                      // Si el rol tiene path '/service-role/', reintenta automáticamente con ese prefijo
                      const serviceRoleArn = iamRoleArn.replace(':role/', ':role/service-role/');
                      const mappedSvc = await client.query(
                        'SELECT 1 FROM sys.iam_pg_role_mappings WHERE pg_role_name = $1 AND arn = $2',
                        [roleName, serviceRoleArn]
                      );
                      if (mappedSvc.rowCount === 0) {
                        await client.query(`AWS IAM GRANT "${roleName}" TO '${serviceRoleArn}'`);
                        console.log(`[OK] Mapeo IAM creado: ${roleName} -> ${serviceRoleArn}`);
                      }
                    }
                  } else {
                    console.log(`[OK] Rol '${roleName}' ya estaba vinculado a ${iamRoleArn}.`);
                  }
                }
              }
            } finally {
              await client.end();
            }
            EOF

            npm run db:grant || {
              echo "[ERROR EN DB:GRANT] No se pudieron asignar permisos SQL a CRUD_USER ('${AURORA_DSQL_CRUD_USER}') o READ_USER ('${AURORA_DSQL_READ_USER}')."
              echo "  -> CAUSA PROBABLE 1: El token actual conectó con permisos 'dsql:DbConnect' en vez de 'dsql:DbConnectAdmin'."
              echo "  -> CAUSA PROBABLE 2: El esquema 'public' o alguna tabla objetivo bloqueó el GRANT en DSQL."
              exit 1
            }

            npm run db:init || {
              echo "[ERROR EN DB:INIT] Falló la carga de datos iniciales (seed/init)."
              echo "  -> CAUSA PROBABLE: Clave duplicada no manejada (falta ON CONFLICT DO NOTHING) o violación de tipos/restricciones."
              exit 1
            }

            echo "[OK] Todas las fases de base de datos finalizaron con éxito."
          fi

        - |
          echo "=== [4/4] COMPILACIÓN DE NEXT.JS ==="
          if ! npm run build; then
            echo "[ERROR CRÍTICO] Falló 'npm run build'."
            echo "  -> CAUSA PROBABLE 1: Error de tipos TypeScript o reglas de ESLint durante la compilación."
            echo "  -> CAUSA PROBABLE 2: Una página estática intentó consultar Aurora DSQL o Bedrock en build-time y falló por permisos/red."
            echo "  -> CAUSA PROBABLE 3: Falta memoria RAM en el contenedor (agrega NODE_OPTIONS='--max-old-space-size=4096' si ves 'heap out of memory')."
            exit 1
          fi
          echo "[OK] Build de Next.js completado."

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
