version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - printf '%s\n' "SQLITE_PATH=${SQLITE_PATH:-}" "AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}" "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}" "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}" "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}" > .env.production
        - npm run env:check
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*