version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - printf '%s\n' "AURORA_DSQL_HOST=${AURORA_DSQL_HOST:-}" "AURORA_DSQL_REGION=${AURORA_DSQL_REGION:-}" "AURORA_DSQL_DATABASE=${AURORA_DSQL_DATABASE:-}" "AURORA_DSQL_PORT=${AURORA_DSQL_PORT:-}" "AURORA_DSQL_CRUD_USER=${AURORA_DSQL_CRUD_USER:-}" "AURORA_DSQL_READ_USER=${AURORA_DSQL_READ_USER:-}" "AURORA_DSQL_POOL_MAX=${AURORA_DSQL_POOL_MAX:-}" "AURORA_DSQL_TOKEN_EXPIRES_IN=${AURORA_DSQL_TOKEN_EXPIRES_IN:-}" "AURORA_DSQL_TOKEN_TTL=${AURORA_DSQL_TOKEN_TTL:-}" "AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}" "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}" "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}" "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}" > .env.production
        - npm run env:check
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
