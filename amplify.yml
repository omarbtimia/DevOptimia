version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        # 1. Pasa todas las variables de Amplify al runtime SSR (.env.production)
        # Excluye variables internas de AWS/sistema para no romper el contenedor Lambda/SSR
        - env | grep -v -E '^(AWS_|_|HOME=|PATH=|PWD=|SHLVL=|USER=|NODE_|NVM_|AMPLIFY_)' > .env.production
        # 2. Inicializa las tablas en Aurora DSQL si aun no existen (usa la misma BD en ambas ramas)
        - node scripts/init-aurora.mjs
        # 3. Compila la aplicacion Next.js
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*