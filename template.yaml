AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Infraestructura compartida para DevOptimia (1 Aurora DSQL + Permisos Bedrock + Roles Amplify para master y develop)

Parameters:
  ExistingAmplifyAppId:
    Type: String
    Default: ""
    Description: ID de Amplify existente (ej. dg8weyg67c6h9). Dejar vacio solo si quieres crear una app nueva.

  GitHubRepository:
    Type: String
    Default: https://github.com/omarbtimia/DevOptimia
    Description: URL del repositorio GitHub

  GitHubOAuthToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Token PAT de GitHub (solo necesario si ExistingAmplifyAppId esta vacio)

Conditions:
  CreateAmplifyApp: !Equals [!Ref ExistingAmplifyAppId, ""]

Resources:
  # 1. UNICA Base de Datos Aurora DSQL compartida entre develop y master
  OptimiaSharedDsqlCluster:
    Type: AWS::DSQL::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      Tags:
        - Key: Application
          Value: DevOptimia
        - Key: SharedBy
          Value: master-and-develop

  # 2. Rol de Servicio de Amplify (Build y despliegue de infraestructura SSR)
  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub devoptimia-amplify-service-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess-Amplify

  # 3. Rol de Computo SSR compartido (Permisos a Aurora DSQL + Amazon Bedrock)
  AmplifyComputeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub devoptimia-amplify-ssr-compute-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - amplify.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: devoptimia-dsql-and-bedrock-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permiso de conexion IAM al cluster compartido de Aurora DSQL
              - Sid: AllowSharedAuroraDsql
                Effect: Allow
                Action:
                  - dsql:DbConnect
                  - dsql:DbConnectAdmin
                Resource: !Sub "arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/${OptimiaSharedDsqlCluster}"

              # Permisos de invocacion para Amazon Bedrock (Modelos fundacionales y Cross-Region Inference Profiles)
              - Sid: AllowBedrockModelsAndProfiles
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                  - bedrock:GetFoundationModel
                  - bedrock:ListFoundationModels
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:application-inference-profile/*"

              # Logs de ejecucion SSR en CloudWatch
              - Sid: AllowSSRCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # 4. App Amplify (solo se crea si no pasaste ExistingAmplifyAppId)
  AmplifyApp:
    Type: AWS::Amplify::App
    Condition: CreateAmplifyApp
    Properties:
      Name: DevOptimia
      Repository: !Ref GitHubRepository
      AccessToken: !Ref GitHubOAuthToken
      Platform: WEB_COMPUTE
      IAMServiceRole: !GetAtt AmplifyServiceRole.Arn
      ComputeRoleArn: !GetAtt AmplifyComputeRole.Arn

Outputs:
  DsqlClusterId:
    Value: !Ref OptimiaSharedDsqlCluster
  DsqlEndpoint:
    Value: !Sub "${OptimiaSharedDsqlCluster}.dsql.${AWS::Region}.on.aws"
  AmplifyServiceRoleArn:
    Value: !GetAtt AmplifyServiceRole.Arn
  AmplifyComputeRoleArn:
    Value: !GetAtt AmplifyComputeRole.Arn
  AmplifyAppIdOutput:
    Value: !If [CreateAmplifyApp, !GetAtt AmplifyApp.AppId, !Ref ExistingAmplifyAppId]