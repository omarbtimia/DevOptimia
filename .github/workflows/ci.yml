name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AURORA_DSQL_HOST: ${{ secrets.AURORA_DSQL_HOST }}
      AURORA_DSQL_REGION: ${{ secrets.AURORA_DSQL_REGION }}
      AURORA_DSQL_READ_IAM_ROLE_ARN: ${{ secrets.AURORA_DSQL_READ_IAM_ROLE_ARN }}
      AURORA_DSQL_CRUD_IAM_ROLE_ARN: ${{ secrets.AURORA_DSQL_CRUD_IAM_ROLE_ARN }}

    steps:
      # ...

      - name: Configurar credenciales AWS
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AURORA_DSQL_REGION }}

      - name: Aplicar esquema y roles en Aurora DSQL
        if: env.AWS_ROLE_TO_ASSUME != '' && env.AURORA_DSQL_HOST != ''
        run: npm run db:init:aurora
