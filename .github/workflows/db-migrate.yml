name: Aurora DB schema

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'db/**'
      - 'scripts/migrate-aurora.mjs'
      - 'scripts/grant-aurora.mjs'
      - 'scripts/init-aurora.mjs'
      - 'scripts/lib/aurora.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:
    inputs:
      allow_destructive:
        description: 'Permitir migraciones destructivas'
        required: false
        default: false
        type: boolean

concurrency:
  group: aurora-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AURORA_DSQL_HOST: ${{ secrets.AURORA_DSQL_HOST }}
      AURORA_DSQL_REGION: ${{ secrets.AWS_REGION }}
      AURORA_DSQL_DATABASE: ${{ secrets.AURORA_DSQL_DATABASE }}
      AURORA_DSQL_PORT: ${{ secrets.AURORA_DSQL_PORT }}
      AURORA_DSQL_CRUD_USER: ${{ secrets.AURORA_DSQL_CRUD_USER }}
      AURORA_DSQL_READ_USER: ${{ secrets.AURORA_DSQL_READ_USER }}
      AURORA_DSQL_TOKEN_EXPIRES_IN: ${{ secrets.AURORA_DSQL_TOKEN_EXPIRES_IN }}
      AURORA_DSQL_TOKEN_TTL: ${{ secrets.AURORA_DSQL_TOKEN_TTL }}
      AURORA_ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validar secrets AWS
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta el secret requerido $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Estado antes de migrar
        run: npm run db:migrate:status
      - name: Aplicar migraciones
        run: npm run db:migrate
      - name: Reaplicar permisos
        run: npm run db:grant
      - name: Verificar conexión de la app
        run: npm run db:init
