name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar @google/clasp
        run: npm install -g @google/clasp

      - name: Crear archivo de autenticación de Clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Sincronizar archivos con Apps Script (Push)
        run: clasp push -f

      - name: Actualizar despliegue existente
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: clasp deploy -i "$DEPLOYMENT_ID" -d "Despliegue automático desde GitHub Actions"