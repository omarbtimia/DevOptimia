name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar @google/clasp
        run: npm install -g @google/clasp

      - name: Crear archivo de autenticación de Clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Sincronizar archivos con Apps Script (Push)
        run: clasp push -f

      - name: Desplegar o actualizar Web App
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          # 1. Crear una nueva versión del código en Apps Script
          NEW_VERSION=$(clasp versions list 2>/dev/null | tail -2 | head -1 | awk '{print $2}')
          echo "Nueva versión creada: $NEW_VERSION"
          
          # 2. Asignar esa nueva versión al DEPLOYMENT_ID existente
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "Actualizando despliegue $DEPLOYMENT_ID a la versión $NEW_VERSION..."
            clasp deploy -i "$DEPLOYMENT_ID" -v "$NEW_VERSION" -d "Despliegue v$NEW_VERSION desde GitHub Actions"
          else
            echo "No hay DEPLOYMENT_ID en Secrets. Creando nuevo despliegue..."
            clasp deploy -v "$NEW_VERSION" -d "Despliegue v$NEW_VERSION desde GitHub Actions"
          fi