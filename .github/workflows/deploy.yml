name: Deploy Shared Infra & Sync Amplify (master & develop)

on:
  push:
    branches:
      - master
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify or Install AWS SAM CLI
        run: |
          if ! command -v sam &> /dev/null; then
            pipx install aws-sam-cli
          fi
          sam --version

      - name: Build SAM template
        run: sam build --template template.yaml

      - name: Deploy Shared Infrastructure (Same DB & Roles for master and develop)
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_OAUTH_TOKEN }}
        run: |
          STACK_NAME="devoptimia-shared-infra"
          PARAMS=()

          if [ -n "$AMPLIFY_APP_ID" ]; then
            PARAMS+=("ExistingAmplifyAppId=$AMPLIFY_APP_ID")
          elif [ -n "$GITHUB_OAUTH_TOKEN" ]; then
            PARAMS+=("GitHubOAuthToken=$GITHUB_OAUTH_TOKEN")
          else
            echo "Error: Debes configurar el secret AMPLIFY_APP_ID (ej. dg8weyg67c6h9) en GitHub Actions."
            exit 1
          fi

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region "${{ secrets.AWS_REGION }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides "${PARAMS[@]}"

      - name: Read Shared CloudFormation Outputs
        id: cf_outputs
        run: |
          STACK="devoptimia-shared-infra"
          DSQL_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='DsqlClusterId'].OutputValue" --output text)
          DSQL_ENDPOINT=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='DsqlEndpoint'].OutputValue" --output text)
          SERVICE_ROLE=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='AmplifyServiceRoleArn'].OutputValue" --output text)
          COMPUTE_ROLE=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='AmplifyComputeRoleArn'].OutputValue" --output text)
          APP_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='AmplifyAppIdOutput'].OutputValue" --output text)

          echo "dsql_id=$DSQL_ID" >> "$GITHUB_OUTPUT"
          echo "dsql_endpoint=$DSQL_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "service_role=$SERVICE_ROLE" >> "$GITHUB_OUTPUT"
          echo "compute_role=$COMPUTE_ROLE" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Sync Amplify App Roles & Configure Current Branch (master or develop)
        run: |
          APP_ID="${{ steps.cf_outputs.outputs.app_id }}"
          BRANCH="${{ github.ref_name }}"

          if [ "$BRANCH" == "master" ]; then
            STAGE="PRODUCTION"
            APP_ENV="production"
          else
            STAGE="DEVELOPMENT"
            APP_ENV="development"
          fi

          # 1. Asigna los roles de servicio y computo (DSQL + Bedrock) a la aplicacion Amplify
          aws amplify update-app \
            --app-id "$APP_ID" \
            --platform WEB_COMPUTE \
            --iam-service-role-arn "${{ steps.cf_outputs.outputs.service_role }}" \
            --compute-role-arn "${{ steps.cf_outputs.outputs.compute_role }}"

          # 2. Crea la rama (master o develop) en Amplify si todavia no existe
          aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH" >/dev/null 2>&1 || \
          aws amplify create-branch \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --stage "$STAGE" \
            --framework "Next.js - SSR" \
            --enable-auto-build

          # 3. Configura la MISMA base de datos y region de Bedrock en la rama actual
          aws amplify update-branch \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --stage "$STAGE" \
            --environment-variables \
              APP_ENV="$APP_ENV" \
              DSQL_CLUSTER_ID="${{ steps.cf_outputs.outputs.dsql_id }}" \
              DSQL_ENDPOINT="${{ steps.cf_outputs.outputs.dsql_endpoint }}" \
              DSQL_REGION="${{ secrets.AWS_REGION }}" \
              BEDROCK_REGION="${{ secrets.AWS_REGION }}" \
              AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"

      - name: Initialize Shared Aurora DSQL Schema (Idempotent)
        env:
          DSQL_CLUSTER_ID: ${{ steps.cf_outputs.outputs.dsql_id }}
          DSQL_ENDPOINT: ${{ steps.cf_outputs.outputs.dsql_endpoint }}
          DSQL_REGION: ${{ secrets.AWS_REGION }}
        run: |
          npm ci
          node scripts/init-aurora.mjs