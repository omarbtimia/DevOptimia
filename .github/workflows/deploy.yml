name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar @google/clasp
        run: npm install -g @google/clasp

      - name: Crear archivo de autenticación de Clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Sincronizar archivos con Apps Script (Push)
        run: clasp push -f

      - name: Desplegar o actualizar Web App
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "Actualizando despliegue existente con ID: $DEPLOYMENT_ID"
            clasp deploy -i "$DEPLOYMENT_ID" -d "Despliegue automático desde GitHub Actions"
          else
            EXISTING_ID=$(clasp deployments | grep -E '^\- [A-Za-z0-9_\-]+' | head -n 1 | awk '{print $2}')
          
            if [ -n "$EXISTING_ID" ]; then
              echo "Se encontró despliegue previo ($EXISTING_ID). Actualizando..."
              clasp deploy -i "$EXISTING_ID" -d "Despliegue automático desde GitHub Actions"
            else
              echo "No se encontró ningún despliegue. Creando la Web App inicial..."
              clasp deploy -d "Despliegue inicial desde GitHub Actions"
            fi
          fi