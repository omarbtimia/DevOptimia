name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar @google/clasp
        run: npm install -g @google/clasp

      - name: Crear archivo de autenticación de Clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Crear archivo .clasp.json
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\".\"}" > .clasp.json

      - name: Verificar estado de clasp
        run: |
          clasp -v
          cat .clasp.json
          clasp status

      - name: Sincronizar archivos con Apps Script (Push)
        run: clasp push -f

      - name: Actualizar despliegue existente (misma URL)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "ERROR: No hay DEPLOYMENT_ID configurado en Secrets."
            exit 1
          fi
          clasp deploy -i "$DEPLOYMENT_ID" -d "Despliegue automático desde GitHub Actions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"